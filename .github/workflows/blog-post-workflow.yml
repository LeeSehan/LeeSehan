name: Latest blog post workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tistory RSS and update README
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re

          url = "https://preciousstory.tistory.com/rss"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
          })

          with urllib.request.urlopen(req) as res:
              tree = ET.parse(res)

          items = tree.findall(".//item")[:5]
          posts = ""
          for item in items:
              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              date = item.findtext("pubDate", "")[:16].strip()
              posts += f"- [{title}]({link}) — {date}\n"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->",
              f"<!-- BLOG-POST-LIST:START -->\n{posts}<!-- BLOG-POST-LIST:END -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)

          print("README updated successfully!")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update blog posts"
          git push
